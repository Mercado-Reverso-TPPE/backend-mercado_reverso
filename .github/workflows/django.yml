name: Django CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: quero
          POSTGRES_USER: quero
          POSTGRES_PASSWORD: quero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quero -d quero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgis://quero:quero@localhost:5432/quero
      DJANGO_SETTINGS_MODULE: quero.settings.dev

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install GeoDjango system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils libproj-dev libgeos-dev gdal-bin libgdal-dev
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Check migrations
      working-directory: backend
      run: python manage.py makemigrations --check --dry-run
    - name: Run Tests
      run: pytest
